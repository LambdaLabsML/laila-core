# py2rs override for tests/functional/policy/memory/base/unit_tests/test_base_memory.py
# `_CountingPool` / `_CustomIndexedPool` are test-local pool subclasses that
# override `_keys` (scan counting) and `_search_keys` (an external index
# hook): a Rust pool's backend cannot be subclassed from a test, so both
# stand in for the plain in-memory pool and the scan-count assertions are
# skipped.
class_aliases:
  _CountingPool: laila::data::schema::base::_LAILA_IDENTIFIABLE_POOL
  _CustomIndexedPool: laila::data::schema::base::_LAILA_IDENTIFIABLE_POOL
skip_tests:
  test_indexed_pool_resolves_without_scanning: asserts on `_CountingPool._keys` scan counts (a subclass hook with no Rust twin)
  test_index_disabled_pool_falls_back_to_scan: asserts on `_CountingPool._keys` scan counts (a subclass hook with no Rust twin)
  test_custom_search_keys_hook_short_circuits_scan: `_CustomIndexedPool._search_keys` is a subclass hook with no Rust twin
  # `self.memory._record = Mock(..)` and friends: a `Mock` assigned onto the
  # memory *instance* replaces a method and its (string) return value flows
  # out of `memorize` / `_record`. A Rust handle has no instance dictionary;
  # the routing these tests pin is covered by
  # `tests/functional/policy/memory/alpha_pool` (`patch.object` on the
  # `_record` / `_fetch` / `_delete` seams).
