[package]
name = "laila-tests"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "laila test suite: generated by tools/py2rs from the Python tests (regenerate-and-diff)"

[lib]
path = "lib.rs"

[dependencies]
# Every storage backend the Python suite exercises (`laila-core[duckdb,hdf5]`).
laila = { workspace = true, features = ["pools"] }
# PTY pairs / null modems for the UART stream-lane fixtures (`streaming_helpers`).
libc = { workspace = true }

[dev-dependencies]
# Fixture loading only (`codecs.json`); the codecs under test are laila's own.
serde_json = { version = "1", features = ["preserve_order"] }
# Raw inspection of pool files written by the backends under test.
rusqlite = { workspace = true }
duckdb = { workspace = true }
hdf5 = { workspace = true }
num-bigint = { workspace = true }
sha2 = { workspace = true }
hmac = { workspace = true }

# Byte-identity of `_codecs` against CPython / msgpack / numpy / cryptography
# reference output (`../laila-js/tests/vectors/codecs.json`).
[[test]]
name = "vectors_codecs"
path = "vectors/codecs.rs"

[[test]]
name = "vectors_pickle"
path = "vectors/pickle.rs"

[[test]]
name = "vectors_msgpack"
path = "vectors/msgpack.rs"

[[test]]
name = "vectors_npy"
path = "vectors/npy.rs"

[[test]]
name = "vectors_recovery_codes"
path = "vectors/recovery_codes.rs"

[[test]]
name = "vectors_fernet"
path = "vectors/fernet.rs"

[[test]]
name = "vectors_pyjson"
path = "vectors/pyjson.rs"

[[test]]
name = "vectors_pyliteral"
path = "vectors/pyliteral.rs"

[[test]]
name = "vectors_dotmap"
path = "vectors/dotmap.rs"

[[test]]
name = "vectors_datetime"
path = "vectors/datetime.rs"

# Serialized entries written by Python laila (`laila-c/tests/vectors/compdata.json`):
# rebuilt through their constitution codes and re-serialised byte-identically.
[[test]]
name = "vectors_compdata"
path = "vectors/compdata.rs"

# Entries written by Python laila (`laila-c/tests/vectors/entries.json`):
# `Entry.from_dict` / `as_dict` / the factories / `_build_from_dict_sync`
# reproduce identity, payload and the serialized text byte-identically.
[[test]]
name = "vectors_entries"
path = "vectors/entries.rs"

# compdata / constitution semantics (dispatch, trust gate, HMAC, builder tokens).
[[test]]
name = "vectors_constitution"
path = "vectors/constitution.rs"

# Pool files written by Python laila (`tests/fixtures/pools/*`): opened by the
# Rust backends, and the Rust-written files carry the identical layout.
[[test]]
name = "vectors_pools_sqlite"
path = "vectors/pools_sqlite.rs"

[[test]]
name = "vectors_pools_duckdb"
path = "vectors/pools_duckdb.rs"

[[test]]
name = "vectors_pools_hdf5"
path = "vectors/pools_hdf5.rs"

