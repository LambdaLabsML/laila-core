[package]
name = "laila-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Rust port of the laila Python package (1:1 surface, Python-shaped bodies)."

[lib]
name = "laila"
path = "src/lib.rs"

[features]
default = ["std", "sqlite", "tls"]
std = ["indexmap/std", "dep:parking_lot", "dep:flate2", "dep:libz-sys", "dep:getrandom", "dep:libc"]
# `tls://` peering (the Python `ssl` module; `rustls` here).
tls = ["std", "dep:rustls"]
# `laila.data.SQLitePool` (system `libsqlite3`; host only).
sqlite = ["std", "dep:rusqlite"]
# `laila.data.DuckDBPool` -- the `laila-core[duckdb]` extra (system
# `libduckdb`, DuckDB 1.5.5; host only).
duckdb = ["std", "dep:duckdb"]
# `laila.data.HDF5Pool` -- the `laila-core[hdf5]` extra (system `libhdf5`;
# host only).
hdf5 = ["std", "dep:hdf5"]
# The HTTP object stores share one REST client (`ureq` over rustls); not a
# user-facing extra.
http = ["std", "dep:ureq"]
# `laila.data.S3Pool` / `CloudflarePool` / `BackblazePool` -- the `[s3]`,
# `[cloudflare]`, `[backblaze]` extras (boto3 in Python; SigV4 REST here).
s3 = ["http"]
cloudflare = ["http"]
backblaze = ["http"]
# `laila.data.GCSPool` -- the `[gcs]` extra (google-cloud-storage in Python;
# the JSON API with a service-account / ADC OAuth2 token here).
gcs = ["http", "dep:rsa"]
# `laila.data.AzurePool` -- the `[azure]` extra (azure-storage-blob in
# Python; the Blob REST API with SharedKey / SAS auth here).
azure = ["http"]
# `laila.data.HuggingFacePool` -- the `[huggingface]` extra.
huggingface = ["http"]
# `laila.data.RedisPool` -- the `[redis]` extra (a managed `redis-server`).
redis = ["std", "dep:redis"]
# `laila.data.PostgresPool` -- the `[postgres]` extra (psycopg in Python;
# an optional managed local `initdb` / `postgres`).
postgres = ["std", "dep:postgres"]
# `laila.data.MongoPool` -- the `[mongo]` extra (pymongo in Python; an
# optional managed local `mongod`).
mongo = ["std", "dep:mongodb"]
# Every storage backend
# (`pip install laila-core[duckdb,hdf5,s3,cloudflare,backblaze,gcs,azure,huggingface,redis,postgres,mongo]`).
pools = [
    "sqlite", "duckdb", "hdf5",
    "s3", "cloudflare", "backblaze", "gcs", "azure", "huggingface",
    "redis", "postgres", "mongo",
]

[dependencies]
laila-macros = { workspace = true }
indexmap = { workspace = true }
parking_lot = { workspace = true, optional = true }
spin = { workspace = true }
libm = { workspace = true }
num-bigint = { workspace = true }
num-traits = { workspace = true }
half = { workspace = true }
aes = { workspace = true }
cbc = { workspace = true }
hmac = { workspace = true }
sha2 = { workspace = true }
flate2 = { workspace = true, optional = true }
libz-sys = { workspace = true, optional = true }
getrandom = { workspace = true, optional = true }
sha1 = { workspace = true }
base64 = { workspace = true }
miniz_oxide = { workspace = true }
rusqlite = { workspace = true, optional = true }
duckdb = { workspace = true, optional = true }
hdf5 = { workspace = true, optional = true }
ureq = { workspace = true, optional = true }
rustls = { workspace = true, optional = true }
rsa = { workspace = true, optional = true }
redis = { workspace = true, optional = true }
postgres = { workspace = true, optional = true }
mongodb = { workspace = true, optional = true }
libc = { workspace = true, optional = true }

[dev-dependencies]
# The crate's own tests run with every storage backend on (`laila-core[duckdb,hdf5]`).
laila-core = { path = ".", features = ["pools"] }
# `tests/macro_ui.rs`: the `laila::python!` / `#[pysig]` compile-fail cases
# under `tests/ui/` (the macro's own diagnostics, pinned by `.stderr`).
trybuild = "1"

# Runnable examples: each `../examples/<name>.rs` is generated by
# `py2rs --script` from the `<name>.py` beside it (`cargo run --example`).
[[example]]
name = "data_types"
path = "../examples/data_types.rs"

[[example]]
name = "cache_chain"
path = "../examples/cache_chain.rs"

[[example]]
name = "peers_tcp"
path = "../examples/peers_tcp.rs"

[[example]]
name = "async_futures"
path = "../examples/async_futures.rs"
