name: laila-js

on:
  push:
    branches: [main]
    paths: ["laila-js/**", ".github/workflows/laila-js.yml"]
  pull_request:
    paths: ["laila-js/**", ".github/workflows/laila-js.yml"]
  workflow_dispatch:

concurrency:
  group: laila-js-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    working-directory: laila-js

jobs:
  unit:
    name: Unit + deep_eval + vectors (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["22", "24"]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: laila-js/package-lock.json

      - name: Install (builds the native loop pump via node-gyp-build)
        run: npm ci

      - name: Rebuild the native loop pump from source
        run: npm run build:native

      - name: Unit tests (1:1 ports of tests/functional)
        run: node --test --test-concurrency=4 'tests/unit/*.test.js'

      - name: Deep evaluation suite (1:1 ports of tests/deep_eval)
        run: node --test --test-concurrency=4 'tests/deep_eval/*.test.js'

      - name: Byte-identity vectors (fixtures generated by the Python package)
        run: npm run test:vectors

  interop:
    name: Python <-> JS interop (TCP + WebSocket, both directions)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # ``import laila`` resolves the repository directory by name.
          path: laila

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: laila/laila-js/package-lock.json

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: laila/pyproject.toml

      - name: Install the Python package (peer side)
        working-directory: laila
        run: |
          python -m pip install --upgrade pip
          python -m pip install .

      - name: Install laila-js
        working-directory: laila/laila-js
        run: npm ci

      - name: Regenerate vectors with this checkout's Python and re-verify
        working-directory: laila/laila-js
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          npm run vectors
          npm run test:vectors
          git -C .. diff --exit-code -- laila-js/tests/vectors

      - name: Interop tests
        working-directory: laila/laila-js
        env:
          LAILA_PYTHON: python
          LAILA_PYTHONPATH: ${{ github.workspace }}
        run: npm run test:interop

  prebuild:
    name: Prebuild native addon (${{ matrix.os }})
    # On demand only: refreshes ``native/prebuilds`` artefacts for a release.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - run: npm run prebuild:native
      - uses: actions/upload-artifact@v4
        with:
          name: prebuilds-${{ matrix.os }}
          path: laila-js/native/prebuilds
