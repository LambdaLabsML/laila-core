name: laila-rs

on:
  push:
    branches: [main]
    paths: ["laila-rs/**", "laila-js/tests/vectors/codecs.json", "laila-c/tests/vectors/*.json", "tests/functional/**"]
  pull_request:
    paths: ["laila-rs/**", "laila-js/tests/vectors/codecs.json", "laila-c/tests/vectors/*.json", "tests/functional/**"]
  workflow_dispatch:

concurrency:
  group: laila-rs-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"
  # One-shot builds gain nothing from incremental caches, and the ~60
  # macro-expanded test crates would otherwise leave several GB under
  # `target/debug/incremental`.
  CARGO_INCREMENTAL: "0"
  # DuckDB C library for the `duckdb` pool backend (same major as the Python
  # `duckdb` wheel the Python suite runs against).
  DUCKDB_VERSION: "1.5.5"
  DUCKDB_LIB_DIR: /usr/local/lib
  DUCKDB_INCLUDE_DIR: /usr/local/include

jobs:
  host:
    name: host (std + tokio) -- fmt, clippy, tests, vectors, py2rs diff
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: laila-rs
    steps:
      - uses: actions/checkout@v5

      # `cargo test --workspace` links ~60 test binaries of ~180 MB each
      # (opt-level 1 + line tables) on top of the dependency tree, the
      # `laila-core` lib tests, the examples and the `trybuild` sub-build:
      # ~20 GB, more than the hosted runner leaves free. Linking into a
      # full disk kills `rust-lld` with SIGBUS, so drop the preinstalled
      # toolchains this job never touches (~25 GB) before building.
      - name: free runner disk space
        working-directory: /
        run: |
          df -h / | tail -1
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup \
            /opt/hostedtoolcache/CodeQL /usr/share/swift /usr/local/share/powershell \
            /usr/local/share/chromium /usr/local/lib/node_modules /usr/lib/google-cloud-sdk
          sudo docker image prune --all --force > /dev/null 2>&1 || true
          df -h / | tail -1

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: laila-rs

      # Phase 3 pool backends link the same system libraries Python uses
      # (sqlite3, HDF5) and the DuckDB C library matching the Python wheel
      # pinned in pyproject.toml, so on-disk layouts are byte-comparable.
      # `redis-server` lets the RedisPool suite run live (it skips without
      # the binary, as the Python suite does); the remote object stores and
      # postgres / mongod stay skipped here, as in the Python CI.
      - name: system libraries (sqlite3, hdf5, duckdb, redis-server)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libsqlite3-dev libhdf5-dev unzip redis-server
          sudo systemctl stop redis-server || true
          curl -sSL -o /tmp/libduckdb.zip \
            "https://github.com/duckdb/duckdb/releases/download/v${DUCKDB_VERSION}/libduckdb-linux-amd64.zip"
          mkdir -p /tmp/libduckdb && unzip -oq /tmp/libduckdb.zip -d /tmp/libduckdb
          sudo cp /tmp/libduckdb/libduckdb.so /usr/local/lib/
          sudo cp /tmp/libduckdb/duckdb.h /usr/local/include/
          sudo ldconfig

      - name: rustfmt
        run: cargo fmt --all -- --check

      - name: clippy (workspace, all targets)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: tests (unit, functional, codec byte-identity vectors)
        run: cargo test --workspace

      - name: disk usage after the test build
        if: always()
        run: |
          df -h / | tail -1
          du -sh target 2>/dev/null || true

      - name: py2rs regenerate-and-diff (generated tests are byte-exact)
        # Every test directory that carries a py2rs-generated main.rs is
        # regenerated from its Python twin and must reproduce byte-exactly.
        run: |
          status=0
          for d in $(grep -rl "Generated by py2rs" tests/functional --include=main.rs | xargs -n1 dirname | sort -u); do
            python3 tools/py2rs/py2rs.py "../tests/functional/${d#tests/functional/}" -o "$d" --root .. --check -q || status=1
          done
          python3 tools/py2rs/py2rs.py ../tests/deep_eval -o tests/deep_eval --root .. --check -q || status=1
          for f in examples/*.py; do
            python3 tools/py2rs/py2rs.py --script "$f" -o "${f%.py}.rs" --check -q || status=1
          done
          exit $status

      - name: examples (py2rs --script programs run end to end)
        run: |
          for f in examples/*.py; do
            cargo run -q -p laila-core --example "$(basename "${f%.py}")"
          done

      - name: py2rs golden tests (one fixture per statement-layer rule)
        run: python3 -m unittest tools/py2rs/tests/test_golden.py

      - name: Mirror Law conformance, Layer A (Python surface == Rust surface)
        # Modules, classes, public methods / fields / functions / constants
        # and every #[pysig] signature are diffed against the Python AST;
        # documented deviations live in tools/conformance/allow.txt.
        run: python3 tools/conformance/check.py --verbose

  embedded:
    name: embedded core (no_std + alloc, thumbv7em-none-eabihf)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: laila-rs
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: thumbv7em-none-eabihf

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: laila-rs

      - name: cargo build --no-default-features (bare-metal Cortex-M4F)
        run: cargo build -p laila-core --no-default-features --target thumbv7em-none-eabihf

      - name: clippy (no_std core)
        run: cargo clippy -p laila-core --no-default-features --target thumbv7em-none-eabihf -- -D warnings
